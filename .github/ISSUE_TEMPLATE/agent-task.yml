name: Agent task
description: A self-contained task an AI agent can pick up and finish in one pull request
labels: [agent-ready]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when the task is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The agent is done when all of them are true.
      placeholder: |
        - [ ] ...
        - [ ] `npm run check` passes
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design reference
      description: >
        Agents cannot open Figma. Name the frames from design/README.md, for example
        design/frames/home--desktop.png, and the layer names that belong to this task.
  - type: textarea
    id: scope
    attributes:
      label: Files and scope
      description: Where the change belongs and what must not be touched.
      placeholder: |
        Touch: src/components/StoryCard, src/App.jsx
        Do not touch: Header, Footer
  - type: dropdown
    id: role
    attributes:
      label: Starting role
      options:
        - orchestrator (multi-step feature)
        - frontend (single component or fix)
        - ux-reviewer (review only)
        - qa (validation only)
    validations:
      required: true
